<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – EcoSort AI</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f8fafc;padding:20px;">

  <div class="card" style="width:100%;max-width:440px;box-shadow:var(--shadow-lg);">
    <div class="text-center" style="margin-bottom:24px;">
      <a href="/index.html" class="brand-logo" style="justify-content:center;margin-bottom:8px;">
        <div class="brand-logo-icon">♻️</div>
        <span>EcoSort AI</span>
      </a>
      <h2 style="font-size:1.5rem;margin-bottom:4px;">Reset Password</h2>
      <p class="text-muted" style="font-size:0.9rem;">Enter your email to receive recovery instructions</p>
    </div>

    <form id="reset-form">
      <div class="form-group">
        <label class="form-label" for="reset-email">Email Address <span class="required">*</span></label>
        <input type="email" id="reset-email" class="form-control" placeholder="name@ecosort.ai" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;">
        Send Recovery Link
      </button>
    </form>

    <div class="text-center" style="margin-top:20px;font-size:0.85rem;color:#64748b;">
      Remembered your password? <a href="/login.html" style="font-weight:600;">Back to login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      await window.supabase.auth.resetPasswordForEmail(email);
      Utils.showToast('Password recovery instructions sent to your email!', 'info');
      setTimeout(() => window.location.href = '/login.html', 1500);
    });
  </script>
</body>
</html>
